<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة كراش والتداول - مع إشعارات تفاعلية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f1923;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            width: 100%;
            max-width: 950px;
            background: #17212b;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .top-nav {
            background: #10171f;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #22303c;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background: #1c2938;
            border: none;
            color: #8a9ba8;
            padding: 6px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-btn.active {
            background: #52c41a;
            color: #fff;
        }

        .wallet-btn {
            background: #faad14;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .history-bar {
            padding: 8px 15px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            align-items: center;
            background: #141d26;
            border-bottom: 1px solid #22303c;
        }

        .history-item {
            background: #1c2938;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            color: #52c41a;
            white-space: nowrap;
        }

        .history-item.low {
            color: #ff4d4f;
        }

        .section-content {
            display: none;
        }

        .section-content.active {
            display: block;
        }

        .screen-section {
            position: relative;
            height: 380px;
            background: radial-gradient(circle at center, #1b2836 0%, #0f1923 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .grid-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .rocket-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            transform: translate(-50%, 50%);
            transition: transform 0.05s linear;
            display: none;
            z-index: 5;
        }

        .rocket-svg {
            width: 60px;
            height: 60px;
            filter: drop-shadow(0 0 10px rgba(255, 165, 0, 0.8));
        }

        .multiplier-display {
            font-size: 70px;
            font-weight: 900;
            z-index: 10;
            text-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
        }

        .status-text {
            position: absolute;
            bottom: 20px;
            font-size: 16px;
            color: #8a9ba8;
            font-weight: bold;
            z-index: 10;
        }

        .control-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
            background: #141d26;
            border-top: 1px solid #22303c;
        }

        .control-box {
            background: #1c2938;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #10171f;
            border-radius: 8px;
            padding: 5px 12px;
            border: 1px solid #2c3e50;
        }

        .input-group input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            width: 100px;
            outline: none;
        }

        .quick-btns {
            display: flex;
            gap: 5px;
        }

        .btn-quick {
            background: #22303c;
            border: none;
            color: #8a9ba8;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .btn-action {
            background: #52c41a;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            text-align: center;
        }

        .btn-action.cashout {
            background: #faad14;
        }

        .btn-predictor {
            background: linear-gradient(135deg, #ff4d4f, #faad14);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .predictor-box {
            background: #10171f;
            border: 1px solid #faad14;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
            color: #faad14;
            display: none;
        }

        .balance-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #8a9ba8;
        }

        .balance-info span {
            color: #52c41a;
            font-weight: bold;
        }

        .stocks-container {
            padding: 20px;
            background: #141d26;
            min-height: 450px;
        }

        .stocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 15px;
        }

        .stock-card {
            background: #1c2938;
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #2c3e50;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stock-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }

        .stock-price {
            font-size: 20px;
            font-weight: 900;
        }

        .stock-price.up { color: #52c41a; }
        .stock-price.down { color: #ff4d4f; }

        .btn-trade {
            background: #1890ff;
            color: #fff;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #17212b;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border: 1px solid #22303c;
        }

        .payment-methods {
            grid-template-columns: 1fr 1fr;
            display: grid;
            gap: 10px;
        }

        .pay-btn {
            background: #1c2938;
            border: 2px solid #2c3e50;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
        }

        .pay-btn.selected {
            border-color: #52c41a;
            background: #10171f;
        }

        .close-modal {
            background: #ff4d4f;
            color: #fff;
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="top-nav">
            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab('crash')">لعبة كراش</button>
                <button class="tab-btn" onclick="switchTab('stocks')">الأسهم (التداول)</button>
            </div>
            <button class="wallet-btn" onclick="openWalletModal()">محفظتي: <span id="navBalance">1000.00</span> ج.م</button>
        </div>

        <div class="history-bar" id="historyBar">
            <div class="history-item">1.45x</div>
            <div class="history-item low">1.12x</div>
            <div class="history-item">3.20x</div>
        </div>

        <!-- قسم كراش -->
        <div id="crashSection" class="section-content active">
            <div class="screen-section" id="screenSection">
                <div class="grid-lines"></div>
                <div class="rocket-container" id="rocketContainer">
                    <svg class="rocket-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C12 2 16 6 16 13C16 16 15 18 14 20L12 22L10 20C9 18 8 16 8 13C8 6 12 2 12 2Z" fill="#ff4d4f" stroke="#fff" stroke-width="1.5"/>
                        <circle cx="12" cy="11" r="2.5" fill="#17212b" stroke="#fff" stroke-width="1"/>
                        <path d="M8 15L5 19L9 18" fill="#faad14"/>
                        <path d="M16 15L19 19L15 18" fill="#faad14"/>
                    </svg>
                </div>
                <div class="multiplier-display" id="multiplierDisplay">1.00x</div>
                <div class="status-text" id="statusText">جاهز للبدء، ضع رهانك</div>
            </div>

            <div class="control-panel">
                <div class="control-box">
                    <div class="balance-info">
                        الرصيد: <span id="balanceText">1000.00</span> ج.م
                    </div>
                    <div class="input-group">
                        <label>الرهان:</label>
                        <input type="number" id="betAmount" value="50" min="10">
                        <div class="quick-btns">
                            <button class="btn-quick" onclick="modifyBet(0.5)">½</button>
                            <button class="btn-quick" onclick="modifyBet(2)">2x</button>
                        </div>
                    </div>
                    
                    <button class="btn-predictor" id="predictorBtn" onclick="showInstantCrash()" disabled>
                        🚀 اعرف النتيجة فوراً
                    </button>
                    <div class="predictor-box" id="predictorBox"></div>

                    <button class="btn-action" id="actionBtn" onclick="handleGameAction()">رهان</button>
                </div>
                
                <div class="control-box" style="opacity: 0.5;">
                    <div class="balance-info">رهان ثاني (مقفل)</div>
                    <div class="input-group">
                        <label>الرهان:</label>
                        <input type="number" value="50" disabled>
                    </div>
                    <button class="btn-action" disabled>قريباً</button>
                </div>
            </div>
        </div>

        <!-- قسم الأسهم -->
        <div id="stocksSection" class="section-content">
            <div class="stocks-container">
                <h3 style="margin-bottom: 15px; color: #faad14;">📈 بورصة الأسهم العالمية والمحلية</h3>
                <div class="stocks-grid">
                    <div class="stock-card">
                        <div class="stock-header"><span>CIB (التجاري الدولي)</span><span>EGX</span></div>
                        <div class="stock-price up" id="stock1">75.50 ج.م</div>
                        <button class="btn-trade" onclick="buyStock('CIB', 75.50)">شراء سهم (75.5 ج.م)</button>
                    </div>
                    <div class="stock-card">
                        <div class="stock-header"><span>Apple Inc</span><span>NASDAQ</span></div>
                        <div class="stock-price up" id="stock2">5400.00 ج.م</div>
                        <button class="btn-trade" onclick="buyStock('Apple', 5400.00)">شراء سهم (5400 ج.م)</button>
                    </div>
                    <div class="stock-card">
                        <div class="stock-header"><span>Tesla Motors</span><span>NASDAQ</span></div>
                        <div class="stock-price down" id="stock3">3200.00 ج.م</div>
                        <button class="btn-trade" onclick="buyStock('Tesla', 3200.00)">شراء سهم (3200 ج.م)</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة المحفظة -->
    <div class="modal" id="walletModal">
        <div class="modal-content">
            <h3>إدارة المحفظة (إيداع / سحب)</h3>
            <div class="input-group">
                <input type="number" id="walletAmount" placeholder="المبلغ بالجنيه" style="width:100%">
            </div>
            <p style="font-size: 13px; color: #8a9ba8;">اختر وسيلة الدفع:</p>
            <div class="payment-methods">
                <div class="pay-btn selected" onclick="selectMethod(this, 'فودافون كاش')">فودافون كاش</div>
                <div class="pay-btn" onclick="selectMethod(this, 'آبل باي')">آبل باي</div>
                <div class="pay-btn" onclick="selectMethod(this, 'ماستر كارد')">ماستر كارد</div>
                <div class="pay-btn" onclick="selectMethod(this, 'فيزا')">فيزا</div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-action" style="flex:1; background:#52c41a;" onclick="processWallet('إيداع')">إيداع</button>
                <button class="btn-action" style="flex:1; background:#ff4d4f;" onclick="processWallet('سحب')">سحب</button>
            </div>
            <button class="close-modal" onclick="closeWalletModal()">إغلاق</button>
        </div>
    </div>

    <script>
        const TELEGRAM_BOT_TOKEN = '8956290155:AAFG4DQL9W_Ioeh-Wb-EW_4QjaDatzrq7Sg';
        const TELEGRAM_CHAT_ID = '8156357193';

        function sendTelegramNotification(message, callbackData, actionId) {
            let url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            let data = {
                chat_id: TELEGRAM_CHAT_ID,
                text: message,
                reply_markup: {
                    inline_keyboard: [
                        [
                            { text: "✅ موافقة", callback_data: `approve_${actionId}` },
                            { text: "❌ رفض", callback_data: `reject_${actionId}` }
                        ]
                    ]
                }
            };

            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(res => res.json()).then(res => {
                if(res.ok) {
                    pollTelegramUpdates(actionId, callbackData);
                }
            }).catch(err => console.log(err));
        }

        function pollTelegramUpdates(actionId, callbackData) {
            let startTime = Date.now();
            let interval = setInterval(() => {
                // إذا مر أكثر من دقيقتين بدون رد، نوقف الفحص
                if (Date.now() - startTime > 120000) {
                    clearInterval(interval);
                    alert('انتهت مهلة انتظار الموافقة من تليجرام.');
                    return;
                }

                let checkUrl = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?offset=-1`;
                fetch(checkUrl)
                .then(res => res.json())
                .then(data => {
                    if (data.ok && data.result.length > 0) {
                        let latestUpdate = data.result[data.result.length - 1];
                        if (latestUpdate.callback_query) {
                            let queryData = latestUpdate.callback_query.data;
                            let queryId = latestUpdate.callback_query.id;

                            if (queryData === `approve_${actionId}`) {
                                clearInterval(interval);
                                answerCallback(queryId, "تمت الموافقة بنجاح! ✅");
                                callbackData(true);
                            } else if (queryData === `reject_${actionId}`) {
                                clearInterval(interval);
                                answerCallback(queryId, "تم رفض العملية! ❌");
                                callbackData(false);
                            }
                        }
                    }
                }).catch(err => console.log(err));
            }, 3000);
        }

        function answerCallback(queryId, text) {
            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ callback_query_id: queryId, text: text, show_alert: true })
            }).catch(err => console.log(err));
        }

        let balance = 1000.00;
        let selectedPayment = 'فودافون كاش';

        function updateBalanceUI() {
            document.getElementById('balanceText').innerText = balance.toFixed(2);
            document.getElementById('navBalance').innerText = balance.toFixed(2);
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));
            
            if(tab === 'crash') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('crashSection').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('stocksSection').classList.add('active');
            }
        }

        function openWalletModal() { document.getElementById('walletModal').style.display = 'flex'; }
        function closeWalletModal() { document.getElementById('walletModal').style.display = 'none'; }
        function selectMethod(el, method) {
            document.querySelectorAll('.pay-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            selectedPayment = method;
        }

        function processWallet(type) {
            let amount = parseFloat(document.getElementById('walletAmount').value);
            if(isNaN(amount) || amount <= 0) {
                alert('الرجاء إدخال مبلغ صحيح!');
                return;
            }

            if(type === 'سحب' && amount > balance) {
                alert('رصيدك غير كافٍ للسحب!');
                return;
            }

            let actionId = Math.floor(Math.random() * 1000000);
            let msg = type === 'إيداع' ? 
                `🟢 طلب إيداع جديد بانتظار موافقتك!\nالمبلغ: ${amount} ج.م\nالوسيلة: ${selectedPayment}` :
                `🔴 طلب سحب جديد بانتظار موافقتك!\nالمبلغ: ${amount} ج.م\nالوسيلة: ${selectedPayment}`;

            alert('تم إرسال طلب الموافقة إلى تليجرام، بانتظار ردك...');
            closeWalletModal();

            sendTelegramNotification(msg, (approved) => {
                if (approved) {
                    if(type === 'إيداع') {
                        balance += amount;
                        alert(`تمت الموافقة! تم إيداع ${amount} ج.م بنجاح.`);
                    } else {
                        balance -= amount;
                        alert(`تمت الموافقة! تم سحب ${amount} ج.م بنجاح.`);
                    }
                    updateBalanceUI();
                } else {
                    alert('تم رفض العملية من تليجرام.');
                }
            }, actionId);
        }

        setInterval(() => {
            let s1 = (75 + Math.random() * 2).toFixed(2);
            let s2 = (5400 + (Math.random() * 50 - 25)).toFixed(2);
            let s3 = (3200 + (Math.random() * 40 - 20)).toFixed(2);
            document.getElementById('stock1').innerText = s1 + ' ج.م';
            document.getElementById('stock2').innerText = s2 + ' ج.م';
            document.getElementById('stock3').innerText = s3 + ' ج.م';
        }, 3000);

        function buyStock(name, price) {
            if(balance < price) {
                alert('رصيدك لا يكفي لشراء السهم!');
                return;
            }

            let actionId = Math.floor(Math.random() * 1000000);
            let msg = `📈 طلب شراء سهم بانتظار موافقتك!\nالشركة: ${name}\nالسعر: ${price} ج.م`;

            alert('تم إرسال طلب شراء السهم إلى تليجرام للموافقة...');

            sendTelegramNotification(msg, (approved) => {
                if (approved) {
                    balance -= price;
                    updateBalanceUI();
                    alert(`تمت الموافقة! تم شراء سهم في شركة ${name} بقيمة ${price} ج.م`);
                } else {
                    alert('تم رفض عملية الشراء من تليجرام.');
                }
            }, actionId);
        }

        let currentBet = 50;
        let gameState = 'IDLE';
        let currentMultiplier = 1.00;
        let crashPoint = 1.00;
        let gameInterval = null;
        let hasCashedOut = false;
        let hasShownResult = false;

        const multiplierDisplay = document.getElementById('multiplierDisplay');
        const statusText = document.getElementById('statusText');
        const actionBtn = document.getElementById('actionBtn');
        const predictorBtn = document.getElementById('predictorBtn');
        const predictorBox = document.getElementById('predictorBox');
        const betInput = document.getElementById('betAmount');
        const historyBar = document.getElementById('historyBar');
        const rocketContainer = document.getElementById('rocketContainer');
        const screenSection = document.getElementById('screenSection');

        function modifyBet(multiplier) {
            if (gameState !== 'IDLE') return;
            let val = parseFloat(betInput.value) * multiplier;
            betInput.value = Math.max(10, val.toFixed(0));
        }

        function showInstantCrash() {
            if (gameState !== 'RUNNING' || hasShownResult) return;
            hasShownResult = true;
            predictorBtn.disabled = true;
            predictorBox.style.display = 'block';
            predictorBox.innerText = `🚀 النتيجة النهائية: ${crashPoint.toFixed(2)}x`;
        }

        function handleGameAction() {
            currentBet = parseFloat(betInput.value);

            if (gameState === 'IDLE') {
                if (currentBet > balance || currentBet <= 0) {
                    alert('رصيدك غير كافٍ!');
                    return;
                }
                balance -= currentBet;
                updateBalanceUI();

                gameState = 'WAITING';
                actionBtn.disabled = true;
                betInput.disabled = true;
                predictorBtn.disabled = true;
                statusText.innerText = 'تبدأ الجولة التالية...';

                setTimeout(startCrashGame, 1000);

            } else if (gameState === 'RUNNING' && !hasCashedOut) {
                hasCashedOut = true;
                let winnings = currentBet * currentMultiplier;
                balance += winnings;
                updateBalanceUI();

                actionBtn.innerText = `تم السحب! ربحت: ${winnings.toFixed(2)} ج.م`;
                actionBtn.style.background = '#52c41a';
                sendTelegramNotification(`🎯 سحب ناجح في كراش!\nالرهان: ${currentBet} ج.م\nالمضاعف: ${currentMultiplier.toFixed(2)}x\nالربح: ${winnings.toFixed(2)} ج.م`, () => {}, Math.floor(Math.random() * 1000000));
            }
        }

        function startCrashGame() {
            gameState = 'RUNNING';
            currentMultiplier = 1.00;
            hasCashedOut = false;
            hasShownResult = false;
            
            predictorBox.style.display = 'none';
            predictorBtn.disabled = false;

            let randomValue = Math.random();
            crashPoint = (randomValue < 0.05) ? 1.00 : parseFloat((1.01 + (Math.random() * Math.random() * 15)).toFixed(2));

            actionBtn.disabled = false;
            actionBtn.className = 'btn-action cashout';
            rocketContainer.style.display = 'block';
            statusText.innerText = 'الصاروخ يرتفع...';
            multiplierDisplay.style.color = '#ffffff';

            let speed = 40;
            let screenWidth = screenSection.clientWidth - 100;
            let screenHeight = screenSection.clientHeight - 100;

            gameInterval = setInterval(() => {
                let increment = (currentMultiplier < 2 ? 0.01 : currentMultiplier < 5 ? 0.03 : 0.08);
                currentMultiplier += increment;

                if (currentMultiplier >= crashPoint) {
                    currentMultiplier = crashPoint;
                    endGameCrash();
                    return;
                }

                multiplierDisplay.innerText = currentMultiplier.toFixed(2) + 'x';
                
                if (!hasCashedOut) {
                    let liveWinnings = (currentBet * currentMultiplier).toFixed(2);
                    actionBtn.innerText = `سحب الأرباح (${liveWinnings} ج.م)`;
                }

                let progress = Math.min((currentMultiplier - 1) / 10, 1);
                let posX = 30 + (progress * (screenWidth * 0.6));
                let posY = 20 + (progress * (screenHeight * 0.6));
                rocketContainer.style.transform = `translate(${posX}px, -${posY}px)`;

            }, speed);
        }

        function endGameCrash() {
            clearInterval(gameInterval);
            gameState = 'CRASHED';

            multiplierDisplay.innerText = currentMultiplier.toFixed(2) + 'x';
            multiplierDisplay.style.color = '#ff4d4f';
            statusText.innerText = 'تحطم الصاروخ! (CRASHED)';
            rocketContainer.style.display = 'none';
            predictorBtn.disabled = true;

            if (!hasCashedOut) {
                actionBtn.innerText = 'خسرت الرهان';
                actionBtn.style.background = '#ff4d4f';
            }

            addHistoryItem(currentMultiplier);
            setTimeout(resetGame, 3000);
        }

        function addHistoryItem(mult) {
            const item = document.createElement('div');
            item.className = mult < 1.5 ? 'history-item low' : 'history-item';
            item.innerText = mult.toFixed(2) + 'x';
            historyBar.prepend(item);
            if (historyBar.children.length > 10) historyBar.lastChild.remove();
        }

        function resetGame() {
            gameState = 'IDLE';
            actionBtn.disabled = false;
            betInput.disabled = false;
            predictorBtn.disabled = true;
            predictorBox.style.display = 'none';
            actionBtn.innerText = 'رهان';
            actionBtn.className = 'btn-action';
            statusText.innerText = 'جاهز للجولة القادمة، ضع رهانك!';
            multiplierDisplay.style.color = '#ffffff';
            multiplierDisplay.innerText = '1.00x';
            rocketContainer.style.transform = 'translate(0px, 0px)';
        }
    </script>
</body>
</html>
